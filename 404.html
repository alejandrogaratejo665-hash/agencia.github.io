<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/agencia.github.io/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAVELIA - Viajes Premium</title>
  <style>
    html,body{margin:0;padding:0;background:#000;color:#D4AF37;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{max-width:480px;text-align:center;padding:32px 24px}
    h1{font-size:28px;margin:0 0 12px;color:#fff;letter-spacing:.05em}
    p{margin:0 0 24px;font-size:14px;line-height:1.6;color:#ffffff80}
    .loader{display:inline-block;width:28px;height:28px;border:3px solid #333;border-top-color:#D4AF37;border-radius:50%;animation:sp 900ms linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License - https://github.com/rafgraph/spa-github-pages
    (function(l){
      var k = l.pathname + l.search + (l.hash || '');
      if (sessionStorage.getItem('spa-redirect') === k) { sessionStorage.removeItem('spa-redirect'); return; }
      sessionStorage.setItem('spa-redirect', k);
      var r = l.pathname.split('/').filter(Boolean);
      var b = r[0] || '';
      var p = '/' + r.slice(1).join('/');
      var q = l.search ? '?q=' + encodeURIComponent(l.search.slice(1)) : '';
      var h = l.hash || '';
      var redirect = '/agencia.github.io/' + q + '#p=' + encodeURIComponent(p) + h;
      // HashRouter: siempre redirigimos a home#/ con la ruta deseada
      if (p && p !== '/') {
        l.replace('/agencia.github.io/' + '#/' + p.replace(/^\//,'') + l.search + l.hash);
      } else {
        l.replace('/agencia.github.io/' + (l.hash ? l.hash : '#/'));
      }
    })(window.location);
  </script>
</head>
<body>
  <div class="box">
    <h1>TRAVELIA · Viajes Premium</h1>
    <p>Redirigiendo a la aplicación… si no se mueve automáticamente, haz clic aquí abajo:</p>
    <div class="loader" aria-hidden="true"></div>
    <p style="margin-top:24px">
      <a href="/agencia.github.io/#/" style="color:#D4AF37;text-decoration:underline;font-weight:700">
        ➤ Abrir TRAVELIA manualmente
      </a>
    </p>
  </div>
</body>
</html>
